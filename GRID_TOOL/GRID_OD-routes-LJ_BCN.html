<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OD Routes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.min.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA60-TwM30jWZjKlFcrxEajuQ_DfF7Iubw"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"></script>
  <!-- Data files. Script tags bypass the CORS rule that blocks fetch() on file://. -->
  <script src="linies_metro.js"></script>
  <script src="estacions.js"></script>
  <script src="bcn-eubucco.js"></script>
  <script src="lj-eubucco.js"></script>
  <script src="lpp-lines.js"></script>
  <script src="lpp-stops.js"></script>
  <script src="meja_lj_FIXED.js"></script>
  <script src="barcelona_boundary_FIXED.js"></script>
  <script src="lj_population_density.js"></script>
  <script src="lj_age_layers.js"></script>
  <script src="barcelona_population.js"></script>
  <script src="lj-traffic-peak.js"></script>
  <script src="bcn-traffic-peak.js"></script>
  <script>
    // ============================================================================
    // ALL LAYER THRESHOLDS & COLORS DEFINED HERE (Population, Youth, Elderly)
    // ============================================================================
    const GOOGLE_LIGHT_STYLE=[
  {elementType:'geometry',stylers:[{color:'#eceae2'}]},
  {elementType:'labels.icon',stylers:[{visibility:'off'}]},
  {elementType:'labels.text.fill',stylers:[{color:'#6e6e66'}]},
  {elementType:'labels.text.stroke',stylers:[{color:'#ffffff'},{weight:2.5}]},
  {featureType:'administrative.land_parcel',stylers:[{visibility:'off'}]},
  {featureType:'administrative.neighborhood',stylers:[{visibility:'off'}]},
  {featureType:'poi',stylers:[{visibility:'off'}]},
  {featureType:'poi.park',elementType:'geometry',stylers:[{color:'#c9dcc0'}]},
  {featureType:'landscape.natural',elementType:'geometry',stylers:[{color:'#d7e4cc'}]},
  {featureType:'landscape.natural.landcover',elementType:'geometry',stylers:[{color:'#cfdfc4'}]},
  {featureType:'landscape.natural.terrain',elementType:'geometry',stylers:[{color:'#d7e4cc'}]},
  {featureType:'poi.attraction',elementType:'geometry',stylers:[{color:'#c9dcc0'},{visibility:'on'}]},
  {featureType:'poi.sports_complex',elementType:'geometry',stylers:[{color:'#c9dcc0'},{visibility:'on'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#ffffff'}]},
  {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#d3d1c6'}]},
  {featureType:'road.arterial',elementType:'labels.text.fill',stylers:[{color:'#8f8d80'}]},
  {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#e9e6d9'}]},
  {featureType:'road.highway',elementType:'geometry.stroke',stylers:[{color:'#c9c6b4'}]},
  {featureType:'road.highway',elementType:'labels.text.fill',stylers:[{color:'#8a8570'}]},
  {featureType:'road.local',elementType:'labels',stylers:[{visibility:'off'}]},
  {featureType:'transit',stylers:[{visibility:'off'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#c7d3dc'}]},
  {featureType:'water',elementType:'labels.text.fill',stylers:[{color:'#7c8ba6'}]},
];

    window.ageLayersConfig = {
      // Population Density thresholds and colors
      // Shared scale (same breaks in both cities). The first five breaks are the
      // original ones; 600 and 1000 extend the top for dense Barcelona cells.
      densityThresholds: [10, 30, 80, 140, 350, 600, 1000],
      densityColors: ['#FFFFCC', '#FED976', '#FC4E2A', '#E31A1C', '#BD0026', '#800026', '#54278f', '#2d004b'],
      // City-relative scale: sextiles of each city's own populated cells,
      // computed at load time (collective accommodation excluded).
      relativeColors: ['#FFFFCC', '#FED976', '#FC4E2A', '#E31A1C', '#BD0026', '#800026'],
      // Collective accommodation (student halls, institutions) is drawn in a
      // neutral grey instead of the density ramp - see LJ_COLLECTIVE_CELLS in
      // lj_population_density.js.
      collectiveColor: '#9e9e9e',
      
      // Youth (ages 0-14, %) thresholds and colors
      youthThresholds: [15, 17, 21, 23],
      youthColors: ['#e6f2ff', '#99d9ff', '#4db8ff', '#0066cc', '#003d7a'],
      
      // Elderly (ages 65+, %) thresholds and colors
      elderlyThresholds: [20, 24, 26, 28],
      elderlyColors: ['#fffacd', '#ffc600', '#ff6b00', '#ff3300', '#8b0000']
    };
    
    // Color functions that read thresholds from config
    // Class colour for any number of breaks: c has one more entry than t
    function classColor(value, t, c) {
      for (let i = 0; i < t.length; i++) if (value <= t[i]) return c[i];
      return c[t.length];
    }

    function getPopulationDensityColor(value) {
      return classColor(value, window.ageLayersConfig.densityThresholds, window.ageLayersConfig.densityColors);
    }

    // n-quantile breaks (n-1 values), rounded, duplicates dropped
    function quantileBreaks(values, n) {
      const v = values.slice().sort((a, b) => a - b);
      const b = [];
      for (let k = 1; k < n; k++) b.push(Math.round(v[Math.floor(k / n * (v.length - 1))]));
      return b.filter((x, i) => i === 0 || x > b[i - 1]);
    }

    function densityLegendHtml(relative, t) {
      const c = relative ? window.ageLayersConfig.relativeColors : window.ageLayersConfig.densityColors;
      const labels = t.map((x, i) => i === 0 ? `≤ ${x}` : `${t[i - 1]}–${x}`).concat(`> ${t[t.length - 1]}`);
      return `<strong>Population Density${relative ? ' (city-relative)' : ''}</strong><br><span style="color:#999; font-size:11px;">people per 100×100m cell${relative ? '; sextiles of this city' : '; shared scale'}</span>` +
        labels.map((l, i) => `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[i]};border:0.5px solid #999;margin-right:5px;"></div>${l}</div>`).join('');
    }
    
    function getYouthColor(value) {
      const t = window.ageLayersConfig.youthThresholds;
      const c = window.ageLayersConfig.youthColors;
      if (value <= t[0]) return c[0];
      if (value <= t[1]) return c[1];
      if (value <= t[2]) return c[2];
      if (value <= t[3]) return c[3];
      return c[4];
    }
    
    function getElderlyColor(value) {
      const t = window.ageLayersConfig.elderlyThresholds;
      const c = window.ageLayersConfig.elderlyColors;
      if (value <= t[0]) return c[0];
      if (value <= t[1]) return c[1];
      if (value <= t[2]) return c[2];
      if (value <= t[3]) return c[3];
      return c[4];
    }
    
    // Collective accommodation is excluded from the thematic layers and from
    // any statistics: a single 2843-person cell is not a residential density.
    function isCollectiveCell(cellId) {
      return typeof LJ_COLLECTIVE_CELLS !== 'undefined'
        && LJ_COLLECTIVE_CELLS.indexOf(cellId) !== -1;
    }

    // Populate age layers with data from ageGridData.
    // One L.geoJSON for the whole grid, not one per cell: building ~3800 nested
    // GeoJSON layers per age layer is what made the Ljubljana tab slow to open.
    const AGE_FIELD_LABELS = { pct_p00_14: 'Youth 0-14', pct_p65_: 'Elderly 65+' };

    function populateAgeLayer(geojson, layerRef, colorFunc, fieldName) {
      if (!layerRef || typeof ageGridData === 'undefined') return;

      // Cells suppressed for statistical disclosure are either absent from
      // ageGridData or carry the -1000001 sentinel. Both mean "no data".
      const valueOf = (feature) => {
        const cellId = feature.properties.id || feature.properties.ime_celice;
        if (isCollectiveCell(cellId)) return null;
        const ageData = ageGridData[cellId];
        const value = ageData ? ageData[fieldName] : null;
        return (typeof value === 'number' && value >= 0) ? value : null;
      };

      const label = AGE_FIELD_LABELS[fieldName] || fieldName;

      L.geoJSON(geojson, {
        filter: (feature) => valueOf(feature) !== null,
        style: (feature) => ({
          fillColor: colorFunc(valueOf(feature)),
          weight: 0.3,
          opacity: 0.9,
          color: '#ccc',
          fillOpacity: 0.75
        }),
        onEachFeature: (feature, layer) => {
          const cellId = feature.properties.id || feature.properties.ime_celice;
          const value = valueOf(feature);
          layer.bindPopup(`<div style="font-size:12px;"><strong>${cellId}</strong><br>${label}: ${value.toFixed(1)}%</div>`);
          layer.on({
            mouseover: () => layer.setStyle({ weight: 1, color: '#333', fillOpacity: 0.95 }),
            mouseout: () => layer.setStyle({ weight: 0.3, color: '#ccc', fillOpacity: 0.75 })
          });
        }
      }).addTo(layerRef);
    }
    
    // Generate legend HTML from config
    function updateLegend() {
      const legendPanel = document.getElementById('legend-panel');
      const legendContent = document.getElementById('legend-content');
      const ljPanel = document.getElementById('panel-lj');
      
      // Show legend only on Ljubljana tab
      if (!ljPanel || !ljPanel.classList.contains('active')) {
        legendPanel.style.display = 'none';
        return;
      }
      
      legendPanel.style.display = 'block';
      
      // Read which thematic layer is selected from the custom radio group
      const checkedRadio = document.querySelector('#lj-map .leaflet-control-layers-overlays input[type="radio"]:checked');
      const selected = checkedRadio ? checkedRadio.value : null;
      const densityOn = selected === 'density';
      const youthOn = selected === 'youth';
      const elderlyOn = selected === 'elderly';
      
      let html = '';
      
      if (selected === 'densityRel') {
        html = densityLegendHtml(true, window.ljRelBreaks || []);
      } else if (densityOn && !youthOn && !elderlyOn) {
        html = densityLegendHtml(false, window.ageLayersConfig.densityThresholds);
      } else if (youthOn && !densityOn && !elderlyOn) {
        html = '<strong>Youth (0–14 years; in %)</strong><br>';
        const t = window.ageLayersConfig.youthThresholds;
        const c = window.ageLayersConfig.youthColors;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[0]};border:0.5px solid #999;margin-right:5px;"></div>0–${t[0]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[1]};border:0.5px solid #999;margin-right:5px;"></div>${t[0]}–${t[1]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[2]};border:0.5px solid #999;margin-right:5px;"></div>${t[1]}–${t[2]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[3]};border:0.5px solid #999;margin-right:5px;"></div>${t[2]}–${t[3]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[4]};border:0.5px solid #999;margin-right:5px;"></div>${t[3]}%+</div>`;
      } else if (elderlyOn && !densityOn && !youthOn) {
        html = '<strong>Elderly (65+ years; in %)</strong><br>';
        const t = window.ageLayersConfig.elderlyThresholds;
        const c = window.ageLayersConfig.elderlyColors;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[0]};border:0.5px solid #999;margin-right:5px;"></div>0–${t[0]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[1]};border:0.5px solid #999;margin-right:5px;"></div>${t[0]}–${t[1]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[2]};border:0.5px solid #999;margin-right:5px;"></div>${t[1]}–${t[2]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[3]};border:0.5px solid #999;margin-right:5px;"></div>${t[2]}–${t[3]}%</div>`;
        html += `<div style="display:flex; margin:3px 0;"><div style="width:10px;height:10px;background:${c[4]};border:0.5px solid #999;margin-right:5px;"></div>${t[3]}%+</div>`;
      }
      
      legendContent.innerHTML = html || 'Select one layer';
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: sans-serif; background: #f5f5f5; }

    .app { display: flex; flex-direction: column; height: 100vh; }

    .tab-bar { display: flex; align-items: stretch; background: #b0b0b0; flex: 0 0 auto; }
    .tab-btn {
      width: 100%; padding: 14px 28px; margin: 0; background: #b0b0b0; color: #555; border: none; border-radius: 4px; box-shadow: none; transform: none;
      cursor: pointer; font-weight: bold; font-size: 14px; line-height: 1;
    }
    .tab-btn.active { background: #d9534f; color: white; }
    .tab-btn:hover:not(.active) { background: #9e9e9e; color: #2a2a2a; }

    .tab-panels { flex: 1; position: relative; overflow: hidden; }
    .tab-panel { position: absolute; inset: 0; display: none; }
    .tab-panel.active { display: block; }

    .container { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
    .sidebar { user-select: none; background: white; padding: 1rem; overflow-y: auto; border-right: 1px solid #ddd; }
    .sidebar h1 { font-size: 18px; margin: 0 0 0.8rem; }
    .map { position: relative; height: 100%; }
    .sidebar label { font-size: 12px; color: #666; margin: 0.3rem 0; display: block; font-weight: 500; }
    .sidebar input, .sidebar select { width: 100%; padding: 4px 0; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 0.6rem; }
    .loading-note { font-size: 12px; color: #999; margin-bottom: 1rem; padding: 6px; background: #f0f0f0; border-radius: 3px; }
    button { width: 100%; padding: 4px 6px; border: 1px solid #e9b1ae; border-radius: 3px; cursor: pointer; margin-bottom: 0.4rem; font-weight: 500; font-size: 12px; color: #a8322e; background: #fcefee; box-shadow: 0 1px 1px rgba(0,0,0,0.08); }
    button:hover { background: #f8dedc; border-color: #df9995; }
    button:active { box-shadow: none; transform: translateY(1px); }
    button.on { background: #eceef0; border-color: #4a5058; color: #2f3439; }   /* active mode: light graphite */
    .sidebar .sec { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #d9534f; border-top: 1px solid #eee; padding-top: 0.6rem; margin: 0.9rem 0 0.2rem; }
    .sidebar .val { font-size: 12px; color: #999; margin-bottom: 0.6rem; }
    /* Fine sliders: thin track, small thumb */
    .sidebar input[type=range] { -webkit-appearance: none; appearance: none; height: 3px; padding: 0; border: none; border-radius: 2px; background: #e6e6e6; margin: 6px 0 0.4rem; }
    .sidebar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #d9534f; border: none; cursor: pointer; }
    .sidebar input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #d9534f; border: none; cursor: pointer; }

    /* Smaller default font for the Leaflet layers control panel */
    .leaflet-control-layers { font-size: 12px; }
    .leaflet-control-layers label { margin: 2px 0; }
    .leaflet-control-layers-base::before { content: 'Base maps'; display: block; font-weight: bold; margin-bottom: 2px; }

    /* Kill Leaflet's default divIcon white box + grey border */
    .leaflet-div-icon,
    .marker-icon,
    .origin-icon,
    .center-icon {
      background: transparent !important;
      border: none !important;
    }
    .marker-icon, .origin-icon { cursor: grab !important; }
    .marker-icon:active, .origin-icon:active { cursor: grabbing !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="bcn">Barcelona</button>
      <button class="tab-btn" data-tab="lj">Ljubljana</button>
    </div>

    <div class="tab-panels">
      <!-- ============ BARCELONA PANEL ============ -->
      <div id="panel-bcn" class="tab-panel active">
        <div class="container">
          <div class="sidebar">
            <h1>Barcelona OD Routes</h1>

            <div class="sec">Display</div>
            <label>Display mode:</label>
            <button id="bcn-modeToggle">Basemap + Thematic Layers</button>
            <label>Map opacity:</label>
            <input type="range" id="bcn-mapOpacity" min="0.2" max="1" step="0.1" value="1">
            <div class="val"><span id="bcn-opacity-val">100</span>%</div>

            <div class="sec">Grid</div>
            <label>Center:</label>
            <button id="bcn-setGridCenterBtn">Click Map to Set Center</button>
            <div class="val">Current: <span id="bcn-gridCenterDisplay">Origin</span></div>
            <label>Circles:</label>
            <input type="range" id="bcn-circles" min="2" max="8" value="3">
            <div class="val"><span id="bcn-circles-val">3</span> rings</div>
            <label>Sectors:</label>
            <input type="range" id="bcn-sectors" min="8" max="24" step="2" value="12">
            <div class="val"><span id="bcn-sectors-val">12</span> divisions</div>
            <label>Scale (km):</label>
            <input type="range" id="bcn-scale" min="2" max="20" value="10">
            <div class="val"><span id="bcn-scale-val">10</span> km</div>
            <label>Rotation:</label>
            <input type="range" id="bcn-rotation" min="0" max="360" value="0">
            <div class="val"><span id="bcn-rotation-val">0</span>°</div>
            <button id="bcn-adjustGridBtn">Adjust Grid Segments</button>

            <div class="sec">Routes</div>
            <button id="bcn-routeColorBtn">Routes: Black</button>
            <button id="bcn-resetDestinationsBtn">Reset All (Origin + Routes)</button>

            <div class="loading-note" id="bcn-loadingStatus">Loading data...</div>
          </div>
          <div class="map" id="bcn-map"></div>
        </div>
      </div>

      <!-- ============ LJUBLJANA PANEL ============ -->
      <div id="panel-lj" class="tab-panel">
        <div class="container">
          <div class="sidebar">
            <h1>Ljubljana OD Routes</h1>

            <div class="sec">Display</div>
            <label>Display mode:</label>
            <button id="lj-modeToggle">Basemap + Thematic Layers</button>
            <label>Map opacity:</label>
            <input type="range" id="lj-mapOpacity" min="0.2" max="1" step="0.1" value="1">
            <div class="val"><span id="lj-opacity-val">100</span>%</div>

            <div class="sec">Grid</div>
            <label>Center:</label>
            <button id="lj-setGridCenterBtn">Click Map to Set Center</button>
            <div class="val">Current: <span id="lj-gridCenterDisplay">Origin</span></div>
            <label>Circles:</label>
            <input type="range" id="lj-circles" min="2" max="8" value="3">
            <div class="val"><span id="lj-circles-val">3</span> rings</div>
            <label>Sectors:</label>
            <input type="range" id="lj-sectors" min="8" max="24" step="2" value="12">
            <div class="val"><span id="lj-sectors-val">12</span> divisions</div>
            <label>Scale (km):</label>
            <input type="range" id="lj-scale" min="2" max="20" value="10">
            <div class="val"><span id="lj-scale-val">10</span> km</div>
            <label>Rotation:</label>
            <input type="range" id="lj-rotation" min="0" max="360" value="0">
            <div class="val"><span id="lj-rotation-val">0</span>°</div>
            <button id="lj-adjustGridBtn">Adjust Grid Segments</button>

            <div class="sec">Routes</div>
            <button id="lj-routeColorBtn">Routes: Black</button>
            <button id="lj-resetDestinationsBtn">Reset All (Origin + Routes)</button>

            <div class="loading-note" id="lj-loadingStatus">Loading data...</div>
          </div>
          <div class="map" id="lj-map">
            <!-- Legend Panel - Inside Map -->
            <div id="legend-panel" style="position: absolute; left: 20px; bottom: 20px; width: 220px; background: white; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 999; padding: 12px; display: none; max-height: 300px; overflow-y: auto;">
              <div style="font-weight: bold; margin-bottom: 8px; font-size: 12px;">Legend</div>
              <div id="legend-content" style="font-size: 12px; color: #999;">Select a layer</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================
    // Shared factory: builds one city's map + controls.
    // Called once per city with a different config; every DOM id
    // and JS variable is scoped inside this function, so the two
    // cities never collide even though they share this one file.
    // ==========================================================
    function initCityMap(cfg) {
      const p = cfg.prefix; // 'bcn' or 'lj'
      const id = (name) => `${p}-${name}`;
      const el = (name) => document.getElementById(id(name));

      const origin = { lat: cfg.origin.lat, lng: cfg.origin.lng };
      const originalOrigin = { ...origin };
      const destinations = cfg.destinations.map(d => ({ ...d }));
      const originalDestinations = destinations.map(d => ({ ...d }));

      // ---- Map + basemaps ----
      const map = L.map(id('map')).setView([origin.lat, origin.lng], 13);

      const map1 = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=cb1_2che_1_9a517cca90f919632c8a6a8c', { attribution: '© CartoDB' });
      const map2 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });
      const map3 = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' });
      const map4 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri Topo' });
      // Google basemap, same light style as PT_analysis_LJ_BCN_google.html
      const map5 = L.gridLayer.googleMutant({ type: 'roadmap', styles: GOOGLE_LIGHT_STYLE });
      const baseMaps = { 'Light': map1, 'Google': map5, 'Street': map2, 'OpenTopo': map3, 'World Topo': map4 };
      map1.addTo(map);

      // ---- Layer groups ----
      const eubuccoLayer = L.layerGroup();
      const overlayMaps = { 'EUBUCCO Buildings': eubuccoLayer };

      let transitLinesLayer = null;
      let transitStopsLayer = null;
      if (cfg.transit) {
        transitLinesLayer = L.layerGroup().addTo(map);
        transitStopsLayer = L.layerGroup().addTo(map);
        overlayMaps[cfg.transit.linesLabel || 'Transit Lines'] = transitLinesLayer;
        overlayMaps[cfg.transit.stopsLabel || 'Transit Stops'] = transitStopsLayer;
      }

      // ---- Boundaries layer ----
      const boundariesLayer = L.layerGroup().addTo(map);
      overlayMaps['City Boundaries'] = boundariesLayer;

      // ---- Density scale state (shared vs city-relative) ----
      let densityMode = 'shared';
      let relBreaks = [];
      let densityGeo = null;      // Ljubljana L.geoJSON
      const bcnCells = [];        // Barcelona polygons
      let bcnLegend = null;
      const densityColor = (pop) => densityMode === 'rel'
        ? classColor(pop, relBreaks, window.ageLayersConfig.relativeColors)
        : getPopulationDensityColor(pop);
      function setDensityMode(mode) {
        if (mode === densityMode) return;
        densityMode = mode;
        if (densityGeo) densityGeo.setStyle(densityGeo.options.style);
        bcnCells.forEach(c => c.setStyle({ fillColor: densityColor(c.pop) }));
        if (bcnLegend && map.hasLayer(populationDensityLayerBcn)) { bcnLegend.remove(); bcnLegend.addTo(map); }
      }

      // ---- Population Density Layer (Barcelona) ----
      let populationDensityLayerBcn = null;
      if (p === 'bcn') {
        // Own radio group below (like Ljubljana); ON by default
        populationDensityLayerBcn = L.layerGroup().addTo(map);
      }

      // ---- Population Density Layer (Ljubljana) - ON BY DEFAULT ----
      // NOTE: NOT added to overlayMaps - it gets its own radio group below,
      // instead of Leaflet's checkbox system, so it can be reliably
      // mutually exclusive with the two age layers.
      let populationDensityLayerLj = null;
      if (p === 'lj') {
        populationDensityLayerLj = L.layerGroup().addTo(map);
      }
      
      // ---- Age Layers (Ljubljana only) - DEFINED IN HTML ----
      // Also NOT added to overlayMaps, for the same reason.
      let youthLayer = null;
      let elderlyLayer = null;
      if (p === 'lj') {
        youthLayer = L.layerGroup();
        elderlyLayer = L.layerGroup();
      }

      // ---- Traffic snapshot (afternoon peak) ----
      // Added before the control is built: addOverlay() later would rebuild
      // the overlays list and wipe the custom Population radio group.
      const trafficData = cfg.trafficVar ? safeGlobal(cfg.trafficVar) : undefined;
      // Missing or old GeoJSON-format traffic files are skipped instead of
      // stopping the whole map; the status box below says which one.
      const trafficFile = cfg.prefix + '-traffic-peak.js';
      const trafficNote = !cfg.trafficVar || Array.isArray(trafficData) ? null
        : trafficData ? trafficFile + ' (old format, download again)' : trafficFile;
      if (Array.isArray(trafficData)) {
        const trafficPeakLayer = L.layerGroup();
        // Same classification as flow_map_template.html (speed / free-flow ratio).
        const tCol = s => s[7] ? '#1d2329' : (s[4] < 5 || !s[3]) ? '#b5bcc3'
          : s[3] / s[4] >= 0.9 ? '#2f9e6f' : s[3] / s[4] >= 0.75 ? '#b9c33a' : s[3] / s[4] >= 0.5 ? '#ec9a29' : '#d1373f';
        const tW = fc => [0, 5, 4, 3, 2, 1.4][fc] || 1.4;
        trafficData.slice().sort((a, b) => b[1] - a[1]).forEach(s => {   // minor roads first, major on top
          L.polyline(s[8], { color: tCol(s), weight: tW(s[1]), opacity: 0.9, dashArray: s[7] ? '4 3' : null })
            .bindPopup(`<strong>${s[0]}</strong><br>` + (s[7] ? 'Closed'
              : `Speed ${s[3]} km/h, free-flow ${s[4]} km/h<br>Speed / free-flow ${s[3] && s[4] ? Math.round(s[3] / s[4] * 100) + ' %' : '–'}<br>Jam factor ${s[5]}`))
            .addTo(trafficPeakLayer);
        });

        // Basic legend, shown only while the traffic layer is on
        const trafficLegend = L.control({ position: 'bottomright' });
        trafficLegend.onAdd = () => {
          const div = L.DomUtil.create('div');
          div.style.cssText = 'background:white; padding:10px 12px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.15); font-size:12px;';
          const items = [['#2f9e6f', '≥ 90 %'], ['#b9c33a', '75–90 %'], ['#ec9a29', '50–75 %'], ['#d1373f', '< 50 %'], ['#b5bcc3', 'Pedestrian / no data']];
          div.innerHTML = `<strong>${cfg.trafficLabel}</strong><br><span style="color:#999; font-size:11px;">speed / free-flow</span>` +
            items.map(([c, l]) => `<div style="display:flex; align-items:center; margin:3px 0;"><div style="width:16px;height:3px;background:${c};margin-right:6px;"></div>${l}</div>`).join('') +
            '<div style="display:flex; align-items:center; margin:3px 0;"><div style="width:16px;height:0;border-top:3px dashed #1d2329;margin-right:6px;"></div>Closed</div>';
          return div;
        };
        trafficPeakLayer.on('add', () => trafficLegend.addTo(map));
        trafficPeakLayer.on('remove', () => trafficLegend.remove());
        overlayMaps[cfg.trafficLabel] = trafficPeakLayer;
      }

      let layersControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

      // Leaflet rebuilds the overlays list whenever a basemap is added/removed
      // in code (e.g. the Display mode button). Re-attach the custom Population
      // group after every rebuild, so it does not disappear.
      const extraOverlayEls = [];
      const rebuildOverlays = layersControl._update;
      layersControl._update = function () {
        rebuildOverlays.call(this);
        extraOverlayEls.forEach(e => this._overlaysList.appendChild(e));
        return this;
      };

      // ---- Population radio group (Barcelona): density only, no age data ----
      if (p === 'bcn') {
        const overlaysList = document.querySelector('#bcn-map .leaflet-control-layers-overlays');
        if (overlaysList) {
          const name = 'bcn-thematic-' + Date.now();
          const wrap = document.createElement('div');
          wrap.style.cssText = 'border-top:1px solid #ddd; margin-top:6px; padding-top:6px;';
          wrap.innerHTML = `
            <div style="font-weight:bold; margin-bottom:2px;">Population</div>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${name}" value="density" checked> Density (shared scale)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${name}" value="densityRel"> Density (city-relative)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${name}" value="none"> None</label>
          `;
          overlaysList.appendChild(wrap);
          extraOverlayEls.push(wrap);
          wrap.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
              if (!radio.checked) return;
              if (radio.value === 'none') { map.removeLayer(populationDensityLayerBcn); return; }
              setDensityMode(radio.value === 'densityRel' ? 'rel' : 'shared');
              map.addLayer(populationDensityLayerBcn);
            });
          });
        }
      }

      // ---- Custom radio group for the three thematic layers (Ljubljana only) ----
      // Native <input type="radio"> with a shared "name" is mutually exclusive
      // by the browser itself - no JS race conditions with Leaflet's own
      // checkbox handling, which is what kept breaking the checkbox approach.
      if (p === 'lj') {
        const overlaysList = document.querySelector('#lj-map .leaflet-control-layers-overlays');
        if (overlaysList) {
          const radioGroupName = 'lj-thematic-' + Date.now();
          const wrap = document.createElement('div');
          wrap.style.borderTop = '1px solid #ddd';
          wrap.style.marginTop = '6px';
          wrap.style.paddingTop = '6px';
          wrap.innerHTML = `
            <div style="font-weight:bold; margin-bottom:2px;">Population</div>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${radioGroupName}" value="density" checked> Density (shared scale)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${radioGroupName}" value="densityRel"> Density (city-relative)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${radioGroupName}" value="youth"> Youth (0–14 years; in %)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${radioGroupName}" value="elderly"> Elderly (65+ years; in %)</label>
            <label style="display:block; margin-left:10px;"><input type="radio" name="${radioGroupName}" value="none"> None</label>
          `;
          overlaysList.appendChild(wrap);
          extraOverlayEls.push(wrap);

          wrap.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
              if (!radio.checked) return;
              // Leaflet's removeLayer() is a safe no-op if the layer isn't
              // currently on the map, so we can just always call all three.
              map.removeLayer(populationDensityLayerLj);
              map.removeLayer(youthLayer);
              map.removeLayer(elderlyLayer);

              if (radio.value === 'density' || radio.value === 'densityRel') {
                setDensityMode(radio.value === 'densityRel' ? 'rel' : 'shared');
                map.addLayer(populationDensityLayerLj);
              }
              else if (radio.value === 'youth') map.addLayer(youthLayer);
              else if (radio.value === 'elderly') map.addLayer(elderlyLayer);
              // 'none' adds nothing back - all three stay off

              updateLegend();
            });
          });
        }
      }

      // ---- Load data (script-tag globals; see head) ----
      // NOTE: window[name] does NOT see top-level const/let declared by another <script> tag
      // (only `var` attaches to window). Use a guarded eval to resolve the binding by name instead.
      function safeGlobal(name) {
        try { return eval(name); } catch (e) { return undefined; }
      }

      // ===== COORDINATE SYSTEM CONVERTER =====
      proj4.defs("EPSG:3794", "+proj=tmerc +lat_0=0 +lon_0=15 +k=0.9999 +x_0=500000 +y_0=-5000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

      function transformCoordinates(coords) {
          if (!Array.isArray(coords)) return coords;
          if (typeof coords[0] === 'number' && typeof coords[1] === 'number' && coords.length === 2) {
              const [x, y] = coords;
              const transformed = proj4('EPSG:3794', 'EPSG:4326', [x, y]);
              return [transformed[0], transformed[1]];
          }
          return coords.map(c => transformCoordinates(c));
      }

      function transformGeoJSON(geoData) {
          if (!geoData) return geoData;
          const transformed = JSON.parse(JSON.stringify(geoData));
          transformed.features.forEach(feature => {
              if (feature.geometry && feature.geometry.coordinates) {
                  feature.geometry.coordinates = transformCoordinates(feature.geometry.coordinates);
              }
          });
          return transformed;
      }
      // ===== END CONVERTER =====

      const status = el('loadingStatus');
      const missing = [];
      if (trafficNote) missing.push(trafficNote);
      const parts = [];

      if (cfg.transit) {
        const t = cfg.transit;
        const linesData = safeGlobal(t.linesVar);
        if (typeof linesData !== 'undefined') {
          L.geoJSON(linesData, {
            style: (feature) => ({
              color: t.lineColor(feature.properties),
              weight: 1.5, opacity: 0.85, lineCap: 'round', lineJoin: 'round'
            }),
            onEachFeature: (feature, layer) => {
              layer.bindPopup(t.linePopup(feature.properties));
            }
          }).addTo(transitLinesLayer);
          parts.push(`${linesData.features.length} lines`);
        } else {
          missing.push(t.linesFile);
        }

        const stopsData = safeGlobal(t.stopsVar);
        if (typeof stopsData !== 'undefined') {
          L.geoJSON(stopsData, {
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
              radius: 3, fillColor: t.stopColor, color: t.stopBorder, weight: 1, opacity: 0.85, fillOpacity: 0.85
            }),
            onEachFeature: (feature, layer) => {
              layer.bindPopup(t.stopPopup(feature.properties));
            }
          }).addTo(transitStopsLayer);
          parts.push(`${stopsData.features.length} stops`);
        } else {
          missing.push(t.stopsFile);
        }
      }

      const buildingsVar = cfg.buildingsVar; // name of the global the buildings script sets
      const buildingsData = safeGlobal(buildingsVar);

      if (typeof buildingsData !== 'undefined') {
        L.geoJSON(buildingsData, {
          renderer: L.canvas(), // full-detail footprints: too many for SVG
          style: { color: '#f39c12', weight: 0.5, opacity: 0.9, fillOpacity: 0.7, fillRule: 'nonzero' }, // nonzero: rounded, self-crossing rings would otherwise show white triangles
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {};
            const h = props.h !== undefined ? props.h : props.height;
            layer.bindPopup(`Building<br>H: ${h ? Number(h).toFixed(1) + 'm' : '?'}`);
          }
        }).addTo(eubuccoLayer);
        parts.push(`${buildingsData.features.length} buildings`);
      } else {
        missing.push(cfg.buildingsFile);
      }

      // ---- Load boundaries from global variables ----
      const boundaryVar = cfg.boundaryVar;
      if (boundaryVar) {
        let boundaryData = safeGlobal(boundaryVar);
        console.log('Original boundary data:', boundaryVar, boundaryData);
        
        // Only transform Ljubljana (EPSG:3794), not Barcelona (already WGS84)
        if (boundaryData && boundaryVar === 'mejaLjData') {
          try {
            boundaryData = transformGeoJSON(boundaryData);
            console.log('Transformed boundary data:', boundaryData);
          } catch (err) {
            console.error('Error transforming boundary:', err);
          }
        }
        
        if (typeof boundaryData !== 'undefined' && boundaryData) {
          try {
            L.geoJSON(boundaryData, {
              filter: (feature) => feature.geometry.type !== 'Point', // Skip point markers
              interactive: false, // Don't respond to clicks
              style: { 
                color: '#d9534f', 
                weight: 2, 
                opacity: 0.8, 
                fill: true,
                fillColor: '#999999',
                fillOpacity: 0.15
              }
            }).addTo(boundariesLayer);
            console.log('Boundary rendered successfully');
            parts.push('boundary');
          } catch (err) {
            console.error('Error rendering boundary:', err);
            missing.push(cfg.boundaryFile);
          }
        } else {
          console.warn('Boundary data is undefined or empty:', cfg.boundaryVar);
          missing.push(cfg.boundaryFile);
        }
      }

      // ---- Load Population Density (Barcelona) ----
      // INE 2026 100 m grid; rows are [SW, SE, NE, NW, population].
      // Canvas renderer: ~23k cells are too many for SVG.
      if (p === 'bcn' && populationDensityLayerBcn && typeof barcelonaPopulation !== 'undefined') {
        relBreaks = quantileBreaks(barcelonaPopulation.map(r => r[4]).filter(v => v > 0), 6);
        const canvas = L.canvas();
        barcelonaPopulation.forEach(r => {
          const pop = r[4];
          const cell = L.polygon(r.slice(0, 4), {
            renderer: canvas,
            fillColor: densityColor(pop),
            weight: 0.3, opacity: 0.9, color: '#ccc', fillOpacity: 0.75
          }).bindPopup(`<div style="font-size:12px;">Population: ${pop}</div>`)
            .addTo(populationDensityLayerBcn);
          cell.pop = pop;
          bcnCells.push(cell);
        });

        bcnLegend = L.control({ position: 'bottomleft' });
        bcnLegend.onAdd = () => {
          const div = L.DomUtil.create('div');
          div.style.cssText = 'background:white; padding:10px 12px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.15); font-size:12px;';
          div.innerHTML = densityLegendHtml(densityMode === 'rel', densityMode === 'rel' ? relBreaks : window.ageLayersConfig.densityThresholds);
          return div;
        };
        populationDensityLayerBcn.on('add', () => bcnLegend.addTo(map));
        populationDensityLayerBcn.on('remove', () => bcnLegend.remove());
        if (map.hasLayer(populationDensityLayerBcn)) bcnLegend.addTo(map);

        parts.push(`${barcelonaPopulation.length} population cells`);
      } else if (p === 'bcn') {
        missing.push('barcelona_population.js');
      }

      // ---- Load Population Density (Ljubljana) ----
      if (p === 'lj' && populationDensityLayerLj && typeof LJ_POPULATION_DENSITY !== 'undefined') {
        try {
          relBreaks = quantileBreaks(LJ_POPULATION_DENSITY.features
            .filter(f => !isCollectiveCell(f.properties.id) && f.properties.pop > 0)
            .map(f => f.properties.pop), 6);
          window.ljRelBreaks = relBreaks;
          densityGeo = L.geoJSON(LJ_POPULATION_DENSITY, {
            style: (feature) => {
              const props = feature.properties;
              if (isCollectiveCell(props.id)) {
                return {
                  fillColor: window.ageLayersConfig.collectiveColor,
                  weight: 1,
                  opacity: 1,
                  color: '#616161',
                  dashArray: '3,2',
                  fillOpacity: 0.6
                };
              }
              return {
                fillColor: densityColor(props.pop),
                weight: 0.3,
                opacity: 0.9,
                color: '#ccc',
                fillOpacity: 0.75
              };
            },
            onEachFeature: (feature, layer) => {
              const props = feature.properties;
              const note = isCollectiveCell(props.id)
                ? '<br><em style="color:#616161">Collective accommodation - excluded from statistics</em>' : '';
              const popup = `<div style="font-size:12px;"><strong>${props.id}</strong><br>Population: ${props.pop}<br>Males: ${props.m} | Females: ${props.f}${note}</div>`;
              layer.bindPopup(popup);
              layer.on({
                mouseover: () => layer.setStyle({ weight: 1, color: '#333', fillOpacity: 0.95 }),
                mouseout: () => layer.setStyle({ weight: 0.3, color: '#ccc', fillOpacity: 0.75 })
              });
            }
          }).addTo(populationDensityLayerLj);
          
          // Populate Age layers (Ljubljana only) - LAYERS ALREADY DEFINED IN HTML
          if (p === 'lj' && typeof populateAgeLayer !== 'undefined' && typeof ageGridData !== 'undefined' && typeof LJ_POPULATION_DENSITY !== 'undefined') {
            populateAgeLayer(LJ_POPULATION_DENSITY, youthLayer, getYouthColor, 'pct_p00_14');
            populateAgeLayer(LJ_POPULATION_DENSITY, elderlyLayer, getElderlyColor, 'pct_p65_');
          }
          
          parts.push(`${LJ_POPULATION_DENSITY.features.length} population cells`);
        } catch (err) {
          console.error('Error loading population density:', err);
          missing.push('Ljubljana population density');
        }
      }

      status.textContent = missing.length
        ? 'Missing file(s): ' + missing.join(', ')
        : '\u2713 ' + parts.join(', ');

      // ---- Panes ----
      const gridPane = map.createPane(id('grid'));
      gridPane.style.zIndex = 250;
      const routePane = map.createPane(id('routes'));
      routePane.style.zIndex = 400;
      const markerPane = map.createPane(id('markers'));
      markerPane.style.zIndex = 600;

      const gridGroup = L.layerGroup().addTo(map);
      const routeGroup = L.layerGroup().addTo(map);
      const markerGroup = L.layerGroup().addTo(map);
      const segmentLayer = L.layerGroup();
      
      let adjustingGrid = false;
      const selectedSegments = new Set();

      function drawGrid() {
        gridGroup.clearLayers();
        segmentLayer.clearLayers();
        const circles = parseInt(el('circles').value);
        const sectors = parseInt(el('sectors').value);
        const scaleKm = parseInt(el('scale').value);
        const rotation = parseInt(el('rotation').value);
        let segId = 0;

        // Draw concentric circles
        for (let i = 1; i <= circles; i++) {
          L.circle(gridCenter, {
            radius: (scaleKm / circles) * i * 1000,
            fill: false, color: '#222', weight: 1, dashArray: '4,4', pane: id('grid')
          }).addTo(gridGroup);
        }

        // Draw sectors and segments
        for (let i = 0; i < sectors; i++) {
          const angle = (360 / sectors) * i + rotation;
          const rad = angle * Math.PI / 180;
          const dist = scaleKm / 111;
          const destLat = gridCenter.lat + dist * Math.cos(rad);
          const destLng = gridCenter.lng + dist / Math.cos(gridCenter.lat * Math.PI / 180) * Math.sin(rad);
          
          // Draw radial line
          L.polyline([gridCenter, { lat: destLat, lng: destLng }], {
            color: '#444', weight: 0.7, dashArray: '3,3', pane: id('grid')
          }).addTo(gridGroup);

          // Create clickable segments (one per ring in this sector)
          for (let ring = 0; ring < circles; ring++) {
            const r1 = ring === 0 ? 0 : (scaleKm / circles) * ring / 111;
            const r2 = (scaleKm / circles) * (ring + 1) / 111;
            const angle1 = (360 / sectors) * i + rotation;
            const angle2 = (360 / sectors) * (i + 1) + rotation;
            const rad1 = angle1 * Math.PI / 180;
            const rad2 = angle2 * Math.PI / 180;
            
            const isSelected = selectedSegments.has(segId);
            const segPoints = [];
            
            // Inner arc or center point
            if (ring === 0) {
              segPoints.push(gridCenter);
            } else {
              for (let a = angle1; a <= angle2; a += 2) {
                const rad = a * Math.PI / 180;
                segPoints.push({
                  lat: gridCenter.lat + r1 * Math.cos(rad),
                  lng: gridCenter.lng + r1 / Math.cos(gridCenter.lat * Math.PI / 180) * Math.sin(rad)
                });
              }
            }
            
            // Outer arc (backwards)
            for (let a = angle2; a >= angle1; a -= 2) {
              const rad = a * Math.PI / 180;
              segPoints.push({
                lat: gridCenter.lat + r2 * Math.cos(rad),
                lng: gridCenter.lng + r2 / Math.cos(gridCenter.lat * Math.PI / 180) * Math.sin(rad)
              });
            }
            
            if (adjustingGrid || isSelected) {
              const seg = L.polygon(segPoints, {
                color: isSelected ? '#27ae60' : '#aaa',
                fillColor: isSelected ? '#2ecc71' : '#bbb',
                fillOpacity: isSelected ? 0.15 : 0.3,
                weight: 0.5,
                interactive: adjustingGrid
              });
              
              if (adjustingGrid) {
                const cid = segId;
                seg.on('click', (e) => {
                  L.DomEvent.stopPropagation(e);
                  if (selectedSegments.has(cid)) {
                    selectedSegments.delete(cid);
                  } else {
                    selectedSegments.add(cid);
                  }
                  drawGrid();
                });
              }
              
              if (adjustingGrid) {
                segmentLayer.addLayer(seg);
              } else if (isSelected) {
                gridGroup.addLayer(seg);
              }
            }
            
            segId++;
          }
        }
      }

      // Routes + markers colour, toggled by routeColorBtn
      let routeColor = '#111111';

      function drawRoutes() {
        routeGroup.clearLayers();
        if (!routeColor) return;   // routes switched off
        destinations.forEach(dest => {
          // White casing under a dark line: stays readable over the red density cells
          L.polyline([origin, dest], { color: '#ffffff', weight: 5, opacity: 0.9, pane: id('routes'), interactive: false }).addTo(routeGroup);
          L.polyline([origin, dest], { color: routeColor, weight: 2.5, opacity: 1, pane: id('routes') }).addTo(routeGroup);
        });
      }

      function drawMarkers() {
        markerGroup.clearLayers();
        if (!routeColor) return;   // routes switched off

        destinations.forEach((dest, idx) => {
          const icon = L.divIcon({
            html: `<div style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:${routeColor};color:white;border-radius:50%;font-weight:bold;font-size:9px;border:1px solid white;box-shadow:0 2px 3px rgba(0,0,0,0.3);">${idx + 1}</div>`,
            iconSize: [16, 16], iconAnchor: [8, 8], className: 'marker-icon', popupAnchor: [0, -10]
          });
          const marker = L.marker(dest, { icon, pane: id('markers'), draggable: true }).addTo(markerGroup);
          marker.on('drag', () => {
            const pos = marker.getLatLng();
            destinations[idx].lat = pos.lat;
            destinations[idx].lng = pos.lng;
            drawRoutes();
          });
        });

        const originIcon = L.divIcon({
          html: `<div style="width:8px;height:8px;background:${routeColor};border-radius:50%;border:1px solid white;box-shadow:0 1px 2px rgba(0,0,0,0.3);"></div>`,
          iconSize: [8, 8], iconAnchor: [4, 4], className: 'origin-icon', popupAnchor: [0, -5]
        });
        const originMarker = L.marker(origin, { icon: originIcon, pane: id('markers'), draggable: true }).addTo(markerGroup);
        originMarker.on('drag', () => {
          const pos = originMarker.getLatLng();
          origin.lat = pos.lat;
          origin.lng = pos.lng;
          drawRoutes();
          drawGrid();
        });
      }

      function update() {
        drawGrid();
        drawRoutes();
        drawMarkers();  // RE-ENABLED
        el('circles-val').textContent = el('circles').value;
        el('sectors-val').textContent = el('sectors').value;
        el('scale-val').textContent = el('scale').value;
        el('rotation-val').textContent = el('rotation').value;
      }

      // ---- Grid center control ----
      let gridCenter = { lat: cfg.gridCenter.lat, lng: cfg.gridCenter.lng };
      let selectingGridCenter = false;
      let tempMarker = null;

      el('setGridCenterBtn').addEventListener('click', () => {
        selectingGridCenter = !selectingGridCenter;
        const btn = el('setGridCenterBtn');
        if (selectingGridCenter) {
          btn.textContent = 'Click on map...';
          btn.classList.add('on');
          map.dragging.disable();
        } else {
          btn.textContent = 'Click Map to Set Center';
          btn.classList.remove('on');
          map.dragging.enable();
          if (tempMarker) { markerGroup.removeLayer(tempMarker); tempMarker = null; }
        }
      });

      map.on('click', (e) => {
        if (selectingGridCenter) {
          gridCenter = { lat: e.latlng.lat, lng: e.latlng.lng };
          if (tempMarker) markerGroup.removeLayer(tempMarker);
          el('gridCenterDisplay').textContent = `${gridCenter.lat.toFixed(4)}°, ${gridCenter.lng.toFixed(4)}°`;
          selectingGridCenter = false;
          el('setGridCenterBtn').textContent = 'Click Map to Set Center';
          el('setGridCenterBtn').classList.remove('on');
          map.dragging.enable();
          update();
        }
      });

      el('routeColorBtn').addEventListener('click', () => {
        // Cycle: Black -> Red -> Off -> Black
        routeColor = routeColor === '#111111' ? '#d9534f' : routeColor === '#d9534f' ? null : '#111111';
        el('routeColorBtn').textContent = routeColor === '#111111' ? 'Routes: Black' : routeColor ? 'Routes: Red' : 'Routes: Off';
        drawRoutes();
        drawMarkers();
      });

      el('adjustGridBtn').addEventListener('click', () => {
        adjustingGrid = !adjustingGrid;
        const btn = el('adjustGridBtn');
        if (adjustingGrid) {
          btn.textContent = 'Done Adjusting';
          btn.classList.add('on');
          segmentLayer.addTo(map);
        } else {
          btn.textContent = 'Adjust Grid Segments';
          btn.classList.remove('on');
          map.removeLayer(segmentLayer);
        }
        drawGrid();
      });

      ['circles', 'sectors', 'scale', 'rotation'].forEach(param => {
        el(param).addEventListener('input', update);
      });

      el('resetDestinationsBtn').addEventListener('click', () => {
        origin.lat = originalOrigin.lat;
        origin.lng = originalOrigin.lng;
        for (let i = 0; i < destinations.length; i++) {
          destinations[i].lat = originalDestinations[i].lat;
          destinations[i].lng = originalDestinations[i].lng;
        }
        update();
      });

      // ---- Mode toggle ----
      const darkBg = L.rectangle([[-90, -180], [90, 180]], {
        color: '#1a1a1a', weight: 0, fillColor: '#1a1a1a', fillOpacity: 1, pane: 'mapPane'
      });
      let nightMode = false;
      el('modeToggle').addEventListener('click', () => {
        nightMode = !nightMode;
        const btn = el('modeToggle');
        if (nightMode) {
          [map1, map2, map3, map4, map5].forEach(m => map.removeLayer(m));
          darkBg.addTo(map);
          darkBg.bringToBack();
          btn.textContent = 'Thematic Layers Only';
          btn.classList.add('on');
        } else {
          darkBg.remove();
          map1.addTo(map);
          btn.textContent = 'Basemap + Thematic Layers';
          btn.classList.remove('on');
        }
      });

      // ---- Event listeners ----
      ['circles', 'sectors', 'scale', 'rotation'].forEach(name => {
        el(name).addEventListener('input', update);
      });

      el('mapOpacity').addEventListener('input', (e) => {
        const opacity = parseFloat(e.target.value);
        [map1, map2, map3, map4, map5].forEach(m => m.setOpacity(opacity));
        el('opacity-val').textContent = Math.round(opacity * 100);
      });

      map.on('zoom', update);
      map.on('move', update);

      // Slider fill up to the handle
      document.querySelectorAll(`#panel-${p} .sidebar input[type=range]`).forEach(r => {
        const fill = () => {
          const pct = (r.value - r.min) / (r.max - r.min) * 100;
          r.style.background = `linear-gradient(to right, #f4c2bf ${pct}%, #e6e6e6 ${pct}%)`;
        };
        r.addEventListener('input', fill);
        fill();
      });

      // ---- Init ----
      el('gridCenterDisplay').textContent = `${gridCenter.lat.toFixed(4)}°, ${gridCenter.lng.toFixed(4)}°`;
      update();

      return map;
    }

    // ==================== BARCELONA ====================
    const bcnMap = initCityMap({
      prefix: 'bcn',
      origin: { lat: 41.35716798139434, lng: 2.117563816738617 },
      destinations: [
        { lat: 41.39349087656098, lng: 2.10433505742488 },
        { lat: 41.408040663675, lng: 2.1303669186088214 },
        { lat: 41.43675127674807, lng: 2.1563230940783074 },
        { lat: 41.4136338394865, lng: 2.161673645629887 },
        { lat: 41.38771322, lng: 2.16971676 }, // #5 -> Catalunya (L1L3)
        { lat: 41.467719076696895, lng: 2.1807657070312336 },
        { lat: 41.409522931575275, lng: 2.1834160690307414 },
        { lat: 41.407152128413905, lng: 2.2119741035461615 },
        { lat: 41.36567409964743, lng: 2.1555097729964245 }
      ],
      gridCenter: { lat: 41.38771322, lng: 2.16971676 }, // Plaça Catalunya
      transit: {
        linesVar: 'metroLinesData',
        linesFile: 'linies_metro.js',
        linesLabel: 'Metro Lines',
        stopsVar: 'estacionsData',
        stopsFile: 'estacions.js',
        stopsLabel: 'Metro Stations',
        lineColor: () => '#2ecc71',
        linePopup: (p) => `<strong>${p.NOM_LINIA}</strong><br>${p.DESC_LINIA || ''}`,
        stopColor: '#2ecc71',
        stopBorder: '#27ae60',
        stopPopup: (p) => `<strong>${p.NOM_ESTACIO}</strong><br>Lines: ${p.PICTO || 'N/A'}`
      },
      buildingsVar: 'bcnEubuccoData',
      buildingsFile: 'bcn-eubucco.js',
      boundaryVar: 'barcelonaBoundaryData',
      boundaryFile: 'barcelona_boundary_FIXED.js',
      trafficVar: 'bcnTrafficPeak',
      trafficLabel: 'Traffic: Tue afternoon peak (20 Oct 2026, 15:45)'
    });

    // ==================== LJUBLJANA ====================
    const ljMap = initCityMap({
      prefix: 'lj',
      origin: { lat: 46.04075648592688, lng: 14.467694364503426 },
      destinations: [
        { lat: 46.07694851115498, lng: 14.453649097950477 },
        { lat: 46.07340651485981, lng: 14.47967081083415 },
        { lat: 46.081765426279865, lng: 14.510952472808683 },
        { lat: 46.06584592876618, lng: 14.52396387281878 },
        { lat: 46.0514099180092, lng: 14.5030494114206 }, // #5 -> Konzorcij
        { lat: 46.06490150726962, lng: 14.613613971856871 },
        { lat: 46.062136342590065, lng: 14.546195523662151 },
        { lat: 46.04571771815196, lng: 14.544915398888447 },
        { lat: 46.037201432191495, lng: 14.501756711479654 }
      ],
      gridCenter: { lat: 46.0514099180092, lng: 14.5030494114206 }, // Konzorcij
      transit: {
        linesVar: 'lppLinesData',
        linesFile: 'lpp-lines.js',
        linesLabel: 'LPP Bus Lines',
        stopsVar: 'lppStopsData',
        stopsFile: 'lpp-stops.js',
        stopsLabel: 'LPP Bus Stops',
        lineColor: () => '#3498db',
        linePopup: (p) => `<strong>Line ${p.route}</strong><br>${p.headsign || ''}`,
        stopColor: '#3498db',
        stopBorder: '#2980b9',
        stopPopup: (p) => `<strong>${p.name}</strong>${p.code ? '<br>Stop ' + p.code : ''}`
      },
      buildingsVar: 'ljEubuccoData',
      buildingsFile: 'lj-eubucco.js',
      boundaryVar: 'mejaLjData',
      boundaryFile: 'meja_lj_FIXED.js',
      trafficVar: 'ljTrafficPeak',
      trafficLabel: 'Traffic: Tue afternoon peak (20 Oct 2026, 15:31)'
    });

    // ==================== TAB SWITCHING ====================
    const maps = { bcn: bcnMap, lj: ljMap };
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-panel').forEach(panel => {
          panel.classList.toggle('active', panel.id === `panel-${tab}`);
        });

        // Leaflet needs to recompute size after being unhidden.
        requestAnimationFrame(() => {
          maps[tab].invalidateSize();
          updateLegend(); // Update legend when switching tabs
        });
      });
    });
    
    // Update legend when layers are toggled via Leaflet control
    setTimeout(() => {
      const layerCheckboxes = document.querySelectorAll('.leaflet-control-layers-overlays input[type="checkbox"]');
      layerCheckboxes.forEach(checkbox => {
        checkbox.addEventListener('change', updateLegend);
      });
      updateLegend(); // Initial legend
    }, 500);
  </script>
</body>
</html>
