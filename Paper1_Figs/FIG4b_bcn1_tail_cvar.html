const DOW_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// dataset indices:
// 0-6   normal TTI per dow
// 7-13  tail TTI per dow
// 14    PTI weekday dashed line
// 15    PTI weekend dashed line
// 16    CVaR weekday solid line
// 17    CVaR weekend solid line
// 18    free-flow ref

let visWd = true, visWe = true;
let lineVis = {pti_weekday:true, pti_weekend:true, cvar_weekday:true, cvar_weekend:true};
const lineIdx = {pti_weekday:14, pti_weekend:15, cvar_weekday:16, cvar_weekend:17};
const lineBtnId = {pti_weekday:'btn-pti-wd', pti_weekend:'btn-pti-we', cvar_weekday:'btn-cvar-wd', cvar_weekend:'btn-cvar-we'};

function makeNormalDataset(dow) {
  const d = D[String(dow)];
  const isWe = dow >= 5;
  const bg = isWe ? 'rgba(148,148,152,0.40)' : 'rgba(70,130,180,0.35)';
  const bc = isWe ? 'rgba(128,128,132,0.65)' : 'rgba(70,130,180,0.55)';
  return {
    label: 'TTI '+DOW_NAMES[dow],
    data: d.normal_x.map((x,i)=>({x, y:d.normal_y[i]})),
    backgroundColor: bg, borderColor: bc,
    borderWidth:0.3, pointRadius:2.0, pointHoverRadius:5,
    showLine:false, order:3
  };
}

function makeTailDataset(dow) {
  const d = D[String(dow)];
  const isWe = dow >= 5;
  const bg = isWe ? 'rgba(196,144,128,0.80)' : 'rgba(205,92,92,0.80)';
  const bc = isWe ? 'rgba(180,128,110,0.95)'  : 'rgba(180,60,60,0.95)';
  return {
    label: 'Tail '+DOW_NAMES[dow],
    data: d.tail_x.map((x,i)=>({x, y:d.tail_y[i]})),
    backgroundColor: bg, borderColor: bc,
    borderWidth:0.5, pointRadius:3.5, pointHoverRadius:6,
    showLine:false, order:2
  };
}

function makeLineDataset(key) {
  const d = D[key];
  const isWd  = key.includes('weekday');
  const isPTI = key.includes('pti');
  const color = isPTI
    ? (isWd ? '#2C6E8A' : '#7A5C2E')
    : (isWd ? '#8B2318' : '#6B3A1F');
  return {
    label: key,
    data: d.x.map((x,i)=>({x, y:d.y[i]})),
    borderColor: color,
    backgroundColor: 'transparent',
    borderWidth: isPTI ? 1.8 : 1.6,
    borderDash: isPTI ? [6,4] : [],
    pointRadius:0, pointHoverRadius:4,
    showLine:true, tension:0.35, order:1
  };
}

let chart;
window.addEventListener('load', ()=>{
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type:'scatter',
    data:{
      datasets:[
        ...Array.from({length:7},(_,i)=>makeNormalDataset(i)),
        ...Array.from({length:7},(_,i)=>makeTailDataset(i)),
        makeLineDataset('pti_weekday'),
        makeLineDataset('pti_weekend'),
        makeLineDataset('cvar_weekday'),
        makeLineDataset('cvar_weekend'),
        {
          label:'Free-flow',
          data:Array.from({length:25},(_,i)=>({x:i,y:1.0})),
          borderColor:'#ddd', backgroundColor:'transparent',
          borderWidth:1, borderDash:[2,4],
          pointRadius:0, showLine:true, order:4
        }
      ]
    },
    options:{
      responsive:true, animation:{duration:180},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#1a1a2e', titleColor:'#aaa', bodyColor:'#fff', padding:9,
          callbacks:{
            title:items=>{
              const x=items[0].parsed.x;
              const h=Math.floor(x), m=Math.round((x-h)*60);
              return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
            },
            label:ctx=>{
              if(ctx.dataset.label==='Free-flow') return null;
              if(ctx.dataset.label.startsWith('pti')||ctx.dataset.label.startsWith('cvar'))
                return `  ${ctx.dataset.label}  ${ctx.parsed.y.toFixed(3)}`;
              const type = ctx.dataset.label.startsWith('Tail') ? '⚠ tail' : 'TTI';
              return `  ${ctx.dataset.label.split(' ')[1]}  ${type} ${ctx.parsed.y.toFixed(3)}`;
            }
          }
        }
      },
      scales:{
        x:{
          type:'linear', min:0, max:24,
          grid:{color:'#eeeeee'},
          ticks:{stepSize:2,color:'#777',font:{size:11},callback:v=>String(v).padStart(2,'0')+':00'}
        },
        y:{
          min:0.75, max:2.25,
          grid:{color:'#eeeeee'},
          ticks:{color:'#777',font:{size:11},callback:v=>v.toFixed(2)},
          title:{display:true,text:'TTI',font:{size:11},color:'#888'}
        }
      }
    }
  });
});

function toggleDaytype(dt) {
  const isWd = dt==='weekday';
  if (isWd) visWd=!visWd; else visWe=!visWe;
  const v = isWd ? visWd : visWe;
  const btnId = isWd ? 'btn-wd' : 'btn-we';
  document.getElementById(btnId).classList.toggle('on',  v);
  document.getElementById(btnId).classList.toggle('off', !v);
  // datasets: 0-4=wd normal, 5-6=we normal, 7-11=wd tail, 12-13=we tail
  const wdDows=[0,1,2,3,4], weDows=[5,6];
  (isWd ? wdDows : weDows).forEach(d=>{
    chart.data.datasets[d].hidden   = !v;
    chart.data.datasets[d+7].hidden = !v;
  });
  chart.data.datasets[14].hidden = !visWd || !lineVis.pti_weekday;
  chart.data.datasets[15].hidden = !visWe || !lineVis.pti_weekend;
  chart.data.datasets[16].hidden = !visWd || !lineVis.cvar_weekday;
  chart.data.datasets[17].hidden = !visWe || !lineVis.cvar_weekend;
  chart.update();
}

function toggleLine(key) {
  lineVis[key]=!lineVis[key];
  document.getElementById(lineBtnId[key]).classList.toggle('on', lineVis[key]);
  document.getElementById(lineBtnId[key]).classList.toggle('off',!lineVis[key]);
  chart.data.datasets[14].hidden = !visWd || !lineVis.pti_weekday;
  chart.data.datasets[15].hidden = !visWe || !lineVis.pti_weekend;
  chart.data.datasets[16].hidden = !visWd || !lineVis.cvar_weekday;
  chart.data.datasets[17].hidden = !visWe || !lineVis.cvar_weekend;
  chart.update();
}
